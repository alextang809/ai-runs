name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-26 also compiles the on-device naming (FoundationModels).
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package app
        run: |
          chmod +x Scripts/package_app.sh
          ./Scripts/package_app.sh
          ditto -c -k --keepParent "build/AI Runs.app" build/AI-Runs.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Runs-${{ matrix.os }}
          path: build/AI-Runs.zip
