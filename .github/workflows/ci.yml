name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-26 also compiles the on-device naming (FoundationModels).
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        timeout-minutes: 5
        run: swift test
      - name: Test account processes with constrained concurrency
        timeout-minutes: 2
        run: |
          account_test_bundle="$(swift build --show-bin-path)/AIRunsPackageTests.xctest"
          env LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 xcrun xctest \
            -XCTest AIRunsAppTests.ManagedAccountClientTests "$account_test_bundle"
      - name: Test local signing scripts
        run: bash Tests/Scripts/local_signing.test.sh
      - name: Package app and check its icon
        run: |
          chmod +x Scripts/package_app.sh
          ./Scripts/package_app.sh
          icns="build/AI Runs.app/Contents/Resources/AppIcon.icns"
          iconutil -c iconset "$icns" -o /tmp/check.iconset
          ls /tmp/check.iconset
          test -f /tmp/check.iconset/icon_512x512@2x.png
      - name: Test browser extension
        working-directory: Tests/BrowserExtension
        run: |
          npm install --no-save --silent jsdom@24
          node content.test.js
      - name: Package app
        run: |
          chmod +x Scripts/package_app.sh
          ./Scripts/package_app.sh
          ditto -c -k --keepParent "build/AI Runs.app" build/AI-Runs.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Runs-${{ matrix.os }}
          path: build/AI-Runs.zip
