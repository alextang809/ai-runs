name: Release

# Push a tag like v0.2.0 to build AI Runs and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package app
        run: |
          chmod +x Scripts/package_app.sh
          ./Scripts/package_app.sh
          ditto -c -k --keepParent "build/AI Runs.app" build/AI-Runs.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="For Macs with Apple silicon, macOS 14 or later. Unzip, move AI Runs to Applications, and open it. The app isn't notarized yet: if macOS blocks it, open System Settings → Privacy & Security and click Open Anyway. Setup steps are in the README."
          # Works whether the tag was pushed from git or made with a release in the GitHub web UI.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/AI-Runs.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/AI-Runs.zip --title "AI Runs $GITHUB_REF_NAME" --notes "$notes"
          fi
